[project]
name = "local-rag-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "tiktoken>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[tool.uv]
package = false

[tool.setuptools]
packages = ["rag", "harness", "bench", "service"]
